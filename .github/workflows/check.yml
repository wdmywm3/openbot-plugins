name: Check plugins
on: [push, pull_request]
jobs:
  memewiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dictionary card runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --require-hashes -r plugins/memewiki/requirements.lock
      - name: Check dictionary, updates and PNG cards
        run: python -X utf8 -B -m unittest discover -s tests -p 'memewiki_test.py' -v
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked plugin test dependencies
        run: |
          npm ci --prefix plugins/memory --ignore-scripts --no-audit --no-fund
          npm ci --prefix plugins/meme-library --ignore-scripts --no-audit --no-fund
      - name: Check standalone plugins without a host checkout
        env:
          OPENBOT_HOST_ROOT: ${{ runner.temp }}/no-openbot-checkout
          OPENBOT_SOURCE: ${{ runner.temp }}/no-openbot-checkout
        run: npm test
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install video test runtime
        timeout-minutes: 10
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Check Watch tools with real video
        run: |
          python -m pip install --require-hashes -r plugins/watch/requirements-media.lock
          python -B -m unittest discover -s tests -p 'watch*_test.py' -v
