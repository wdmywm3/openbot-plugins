<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>表情包</title><link rel="stylesheet" href="/__ui/controls.css"><link rel="stylesheet" href="style.css"></head><body>
<div class="toolbar"><input id="query" type="search" placeholder="搜索名称、含义、图片文字或标签" aria-label="搜索表情"><select id="status" aria-label="发送状态"><option value="">全部状态</option><option value="enabled">已启用</option><option value="disabled">已停用</option></select><select id="profile-filter" aria-label="适用角色"></select><select id="chat-filter" aria-label="适用聊天"></select><button id="filters">更多筛选</button></div>
<div class="toolbar" id="extra-filters" hidden><select id="source" aria-label="来源"><option value="">全部来源</option><option value="import">手动导入</option><option value="qq">QQ 收藏</option><option value="chat">聊天收藏</option><option value="profile">专属角色表情</option></select><select id="analysis" aria-label="识别状态"><option value="">全部识别状态</option><option value="ready">已识别</option><option value="pending">待识别</option><option value="failed">处理失败</option></select><button id="reset">清除筛选</button></div>
<div class="toolbar"><button id="import">导入</button><button id="select-mode">批量选择</button><button id="settings">设置</button><details class="more-menu"><summary>更多</summary><div class="actions"><button id="sync">同步 QQ 收藏</button><button id="update">补全识别</button><button id="export">导出全部</button><button id="search-history">使用记录</button></div></details></div>
<div id="batch" class="toolbar" hidden><label class="check"><input type="checkbox" id="page-selection">选择本页</label><span id="selected-count"></span><button id="select-all">选择全部筛选结果</button><button data-batch="enable">启用</button><button data-batch="disable">停用</button><button data-batch="reanalyze">重新识别</button><button data-batch="scope">设置范围</button><button data-batch="export">导出</button><button class="danger" data-batch="remove">删除</button></div>
<p id="error" role="alert" hidden></p><div id="progress" role="status" hidden></div><p id="summary" class="muted"></p><div id="grid" class="grid"></div><div id="paging"><button id="previous">上一页</button><span id="page"></span><button id="next">下一页</button></div><script src="app.js"></script></body></html>
