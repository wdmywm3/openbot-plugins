<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>自定义黑话</title>
<style>
:root{color-scheme:light dark;font:14px/1.5 system-ui,sans-serif;--bg:var(--bg-primary,Canvas);--fg:var(--text-primary,CanvasText);--muted:var(--text-secondary,GrayText);--border:var(--border-primary,ButtonBorder);--accent:var(--accent-primary,Highlight)}
body{margin:0;padding:18px;color:var(--fg);background:var(--bg)}p{color:var(--muted);margin:0 0 16px}form{display:grid;gap:10px;margin-bottom:18px}label{display:grid;gap:5px}input,textarea,button{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 10px}textarea{resize:vertical;min-height:72px}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}.buttons{display:flex;gap:8px;justify-content:flex-end}article{padding:12px 0;border-top:1px solid var(--border);display:grid;grid-template-columns:1fr auto;gap:6px 16px}article p{white-space:pre-wrap;overflow-wrap:anywhere;margin:4px 0}article .buttons{align-self:start}#notice{min-height:22px;color:var(--muted);margin:8px 0}footer{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}@media(max-width:480px){body{padding:12px}article{grid-template-columns:1fr}article .buttons{justify-content:flex-start}}
</style></head><body>
<p>这里的词条供当前实例使用；聊天中添加的同名黑话优先。</p>
<form id="form"><label>名称<input id="name" required maxlength="32" autocomplete="off"></label><label>含义<textarea id="meaning" required maxlength="600"></textarea></label><div class="buttons"><button type="button" id="cancel" hidden>取消编辑</button><button class="primary" type="submit">保存</button></div></form>
<div id="notice" role="status" aria-live="polite"></div><div id="list"></div><footer><button id="previous" hidden>上一页</button><button id="next" hidden>下一页</button></footer>
<script>
const $=id=>document.getElementById(id), bridge=window.openbotPlugin;
let revision=0,cursor, nextCursor, history=[];
const setBusy=value=>document.querySelectorAll('button,input,textarea').forEach(node=>node.disabled=value);
function reset(){ $('form').reset();revision=0;$('name').readOnly=false;$('cancel').hidden=true; }
async function run(action){setBusy(true);$('notice').textContent='';try{await action();}catch(e){$('notice').textContent=e.message||'操作失败，请重试。';}finally{setBusy(false);}}
async function load(){
 const result=await bridge.callAction('list_terms',cursor?{cursor}:{});
 $('list').replaceChildren(); nextCursor=result.nextCursor;
 for(const row of result.records){
  const article=document.createElement('article'),body=document.createElement('div'),title=document.createElement('strong'),meaning=document.createElement('p'),buttons=document.createElement('div');
  title.textContent=row.key;meaning.textContent=row.value.meaning;body.append(title,meaning);buttons.className='buttons';
  const edit=document.createElement('button');edit.textContent='编辑';edit.onclick=()=>{$('name').value=row.key;$('name').readOnly=true;$('meaning').value=row.value.meaning;revision=row.revision;$('cancel').hidden=false;$('meaning').focus();};
  const remove=document.createElement('button');remove.textContent='删除';remove.onclick=()=>run(async()=>{await bridge.callAction('delete_term',{name:row.key,revision:row.revision});reset();await load();$('notice').textContent='已删除';});
  buttons.append(edit,remove);article.append(body,buttons);$('list').append(article);
 }
 if(!result.records.length)$('notice').textContent='还没有自定义黑话。';
 $('previous').hidden=!history.length;$('next').hidden=!nextCursor;
}
$('form').onsubmit=e=>{e.preventDefault();run(async()=>{await bridge.callAction('save_term',{name:$('name').value.trim(),meaning:$('meaning').value.trim(),revision});reset();cursor=undefined;history=[];await load();$('notice').textContent='已保存';});};
$('cancel').onclick=reset;
$('next').onclick=()=>run(async()=>{history.push(cursor);cursor=nextCursor;await load();});
$('previous').onclick=()=>run(async()=>{cursor=history.pop();await load();});
run(load);
</script></body></html>
