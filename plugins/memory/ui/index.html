<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>记忆整理</title><link rel="stylesheet" href="/__ui/controls.css"><link rel="stylesheet" href="style.css"></head><body>
<div class="toolbar"><select id="chat" aria-label="整理范围"><option value="">实例默认</option></select><span id="save-status" role="status"></span><details id="more-actions"><summary>更多</summary><button id="import">导入旧数据</button></details></div>
<p id="error" role="alert" hidden></p>
<section id="preferences" class="organize-settings"><label class="setting-row" id="inherit-label" hidden><span>聊天设置</span><select id="inherit"><option value="inherit">跟随实例默认</option><option value="override">单独设置</option></select></label>
<fieldset id="policy-fields"><div class="setting-row"><span>自动整理</span><button id="enabled" role="switch" aria-label="自动整理" aria-checked="false"></button></div><div id="enabled-fields" hidden><label class="setting-row"><span>整理时间</span><div class="toolbar"><select id="schedule"><option value="daily">每天</option><option value="hourly">每小时</option></select><input id="daily-time" aria-label="每天整理时间" type="time" value="03:00"></div></label><label class="setting-row"><span>空闲整理</span><select id="idle"><option value="0">关闭</option><option value="5">空闲 5 分钟</option><option value="15">空闲 15 分钟</option><option value="30">空闲 30 分钟</option><option value="60">空闲 60 分钟</option></select></label></div></fieldset>
<details id="advanced" hidden><summary>更多整理设置</summary><div id="style" hidden><label class="check"><input id="style-lock" type="checkbox">固定交流偏好</label><div id="style-fields"></div><button id="style-reset">恢复默认偏好</button></div><p id="scan-start" class="muted" hidden></p><button id="start-now">跳过此前记录</button></details>
<button id="retry-save" hidden>重试保存</button></section>
<div class="section-heading"><h3>整理记录</h3><div class="actions"><button id="run">现在整理</button><button id="pause" hidden>暂停自动整理</button><button id="resume" hidden>恢复自动整理</button><button id="stop" hidden>停止当前整理</button></div></div><p id="status" role="status"></p><div id="items"></div><button id="more" hidden>加载更多</button>
<details id="followups" hidden><summary>复查记录</summary><div id="followup-items"></div></details><details id="maintenance" hidden><summary>整理建议</summary><div id="maintenance-items"></div></details><script src="app.js"></script></body></html>
